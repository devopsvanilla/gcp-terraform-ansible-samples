---
# ==============================================================================
# Playbook 07: Gerenciamento de Secrets e Variáveis no Morpheus Cypher
# ==============================================================================
# Finalidade:
#   Armazena, consulta e gerencia segredos no Morpheus Cypher Vault.
#   Suporta tipos: secret, tfvars, password, key, uuid.
#
# Execução (Exemplos):
#   # Armazenar um secret:
#   ansible-playbook -i inventory/hosts.yml playbooks/07-manage-cypher-secrets.yml \
#     -e "secret_name=gcp_app_db_password secret_value='M1nh@S3nh@F0rt3!' secret_action=present"
#
#   # Armazenar conteúdo tfvars:
#   ansible-playbook -i inventory/hosts.yml playbooks/07-manage-cypher-secrets.yml \
#     -e "secret_name=tfvars/gcp-create-vm-poc secret_mount=tfvars secret_value='environment = \"poc\"' secret_action=present"
#
#   # Remover secret:
#   ansible-playbook -i inventory/hosts.yml playbooks/07-manage-cypher-secrets.yml \
#     -e "secret_name=gcp_app_db_password secret_action=absent"
# ==============================================================================

- name: Gerenciar Segredos e Variáveis no Cypher do Morpheus
  hosts: morpheus_servers
  gather_facts: false
  vars_files:
    - ../group_vars/morpheus.yml
  vars:
    secret_mount: "secret"              # Opções: secret, tfvars, password, key, uuid
    secret_name: "poc_gcp_sample_secret"
    secret_value: "ConteudoUltraSecreto-12345"
    secret_ttl: "30d"                   # Duração do segredo (ex: 15m, 8h, 7d, 30d, 0=sem expiração)
    secret_action: "present"            # Opções: present, absent

  tasks:
    - name: Consultar segredos existentes no Cypher
      morpheus.core.cypher_info:
      register: cypher_list_result

    - name: Exibir lista de chaves existentes no Cypher (apenas chaves, sem expor valores)
      ansible.builtin.debug:
        msg: >-
          Chave: {{ item.item_key | default(item.key | default('N/A')) }} |
          Tipo: {{ item.type | default('N/A') }}
      loop: "{{ cypher_list_result.cypher | default(cypher_list_result.morpheus_cypher | default([])) }}"
      loop_control:
        label: "{{ item.item_key | default(item.key | default('item')) }}"

    - name: "Gravar secret no Cypher: {{ secret_mount }}/{{ secret_name }}"
      morpheus.core.cypher:
        mount: "{{ secret_mount }}"
        name: "{{ secret_name }}"
        value: "{{ secret_value }}"
        ttl: "{{ secret_ttl }}"
        state: present
      register: cypher_save_result
      when: secret_action == 'present'

    - name: Exibir status da gravação
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " Segredo armazenado com sucesso no Cypher! "
          - "=========================================================="
          - "Chave:      {{ cypher_save_result.cypher.item_key | default(secret_name) }}"
          - "Expira em:  {{ cypher_save_result.cypher.expire_date | default('Nunca / TTL padrão') }}"
          - "=========================================================="
      when:
        - secret_action == 'present'
        - cypher_save_result is defined

    - name: "Remover secret do Cypher: {{ secret_mount }}/{{ secret_name }}"
      morpheus.core.cypher:
        mount: "{{ secret_mount }}"
        name: "{{ secret_name }}"
        state: absent
      when: secret_action == 'absent'
