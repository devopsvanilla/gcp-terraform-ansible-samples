---
# ==============================================================================
# Playbook 02: Listar Clouds e Grupos no Morpheus (Foco em GCP)
# ==============================================================================
# Finalidade:
#   Consulta todas as Clouds configuradas no Morpheus (incluindo o GCP),
#   seus respectivos IDs, status, tipos e grupos associados.
#
# Execução:
#   ansible-playbook playbooks/02-list-clouds.yml
# ==============================================================================

- name: Listar Clouds e Grupos Configurados no Morpheus
  hosts: morpheus_servers
  gather_facts: false
  vars_files:
    - ../group_vars/morpheus.yml

  tasks:
    - name: Consultar Clouds configuradas no Morpheus
      morpheus.core.cloud_info:
      register: clouds_result

    - name: Consultar Grupos de Infraestrutura no Morpheus
      morpheus.core.group_info:
      register: groups_result

    - name: Exibir resumo das Clouds encontradas
      ansible.builtin.debug:
        msg: >-
          Cloud ID: {{ item.id }} |
          Nome: {{ item.name }} |
          Tipo: {{ item.cloud_type.name | default(item.code | default(item.type | default('Desconhecido'))) }} |
          Status: {{ item.status | default('N/A') }} |
          Ativo: {{ item.enabled | default(true) }}
      loop: "{{ clouds_result.clouds | default(clouds_result.morpheus_clouds | default([])) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Destacar Cloud GCP configurada
      vars:
        all_clouds: "{{ clouds_result.clouds | default(clouds_result.morpheus_clouds | default([])) }}"
        gcp_clouds: "{{ all_clouds | selectattr('name', 'search', 'gcp|google', ignorecase=true) | list }}"
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " Cloud GCP Identificada no Morpheus: "
          - "=========================================================="
          - "ID: {{ item.id }}"
          - "Nome: {{ item.name }}"
          - "Tipo: {{ item.cloud_type.name | default(item.type | default('Google Cloud')) }}"
          - "Localização: {{ item.location | default('global') }}"
          - "=========================================================="
      loop: "{{ gcp_clouds }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Exibir resumo dos Grupos encontrados
      ansible.builtin.debug:
        msg: >-
          Grupo ID: {{ item.id }} |
          Nome: {{ item.name }} |
          Código: {{ item.code | default('N/A') }} |
          Localização: {{ item.location | default('N/A') }}
      loop: "{{ groups_result.groups | default(groups_result.morpheus_groups | default([])) }}"
      loop_control:
        label: "{{ item.name }}"
