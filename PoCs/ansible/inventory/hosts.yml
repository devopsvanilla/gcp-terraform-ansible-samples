---
# ==============================================================================
# Inventário Estático para Conexão HTTPAPI com Morpheus Data
# ==============================================================================
# Define o host de controle do Morpheus utilizando o plugin httpapi da coleção.
# ==============================================================================

all:
  children:
    morpheus_servers:
      hosts:
        morpheus_appliance:
          ansible_host: "morpheus.cec.dev.br"
          ansible_connection: httpapi
          ansible_network_os: morpheus.core.morpheus
          ansible_httpapi_use_ssl: true
          ansible_morpheus_token: "c356423a-e931-40ca-a0de-6572ed4b9c2b"
          ansible_httpapi_session_key: "c356423a-e931-40ca-a0de-6572ed4b9c2b"
          ansible_httpapi_port: 443

    morpheus_local:
      hosts:
        localhost:
          ansible_connection: local
